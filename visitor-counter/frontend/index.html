<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Visitor Counter</title>
    <style>
      :root {
        color-scheme: light dark;
        color: #1f2937;
        background: linear-gradient(180deg, #f4f7ff 0%, #eef2ff 100%);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: radial-gradient(circle at top right, rgba(59, 130, 246, 0.12), transparent 28%),
          radial-gradient(circle at bottom left, rgba(139, 92, 246, 0.12), transparent 30%),
          linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }
      .card {
        width: min(100%, 560px);
        border-radius: 1.5rem;
        padding: 2rem;
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid rgba(148, 163, 184, 0.18);
        box-shadow: 0 20px 60px rgba(15, 23, 42, 0.08);
      }
      .heading {
        margin: 0 0 1rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .heading h1 {
        margin: 0;
        font-size: clamp(2rem, 2.75vw, 2.75rem);
        letter-spacing: -0.04em;
      }
      .heading p {
        margin: 0;
        color: #475569;
        font-size: 0.95rem;
      }
      .count {
        font-size: clamp(3rem, 5vw, 4.5rem);
        font-weight: 700;
        letter-spacing: -0.05em;
        color: #0f172a;
        margin: 1rem 0;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-bottom: 1rem;
      }
      .actions button {
        border: none;
        border-radius: 999px;
        padding: 0.9rem 1.4rem;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.16s ease, box-shadow 0.16s ease, background-color 0.16s ease;
      }
      .actions button:hover {
        transform: translateY(-1px);
      }
      #refreshBtn {
        background: #f1f5f9;
        color: #334155;
      }
      #incBtn {
        background: #2563eb;
        color: white;
      }
      #resetBtn {
        background: #ef4444;
        color: white;
      }
      #refreshBtn:hover {
        box-shadow: 0 12px 24px rgba(15, 23, 42, 0.08);
      }
      #incBtn:hover {
        background: #1d4ed8;
      }
      #resetBtn:hover {
        background: #dc2626;
      }
      .status {
        margin: 0;
        color: #64748b;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="heading">
        <div>
          <h1>Visitor Counter</h1>
          <p>A simple dashboard for tracking visitor count in real time.</p>
        </div>
      </div>
      <div id="count" class="count">—</div>
      <div class="actions">
        <button id="refreshBtn">Refresh</button>
        <button id="incBtn">Increment</button>
        <button id="resetBtn">Reset</button>
      </div>
      <p id="status" class="status">Initializing…</p>
    </div>

    <script type="module">
      import { initApp } from './app.js';
      initApp();
    </script>
  </body>
</html>
