name: Terraform Init

on:
  workflow_dispatch:
    inputs:
      state_bucket:
        description: "Globally unique S3 bucket name for Terraform state"
        required: true
        default: "my-uq-state-bkt"
        type: string
      aws_region:
        description: "AWS region for the Terraform state bucket"
        required: true
        default: "ap-south-1"
        type: string
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  initialize:
    name: Initialize Terraform
    runs-on: self-hosted
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate AWS credentials
        run: |
          if ! aws sts get-caller-identity; then
            echo "AWS credentials are not configured correctly."
            exit 1
          fi

      - name: Initialize Terraform backend
        env:
          STATE_BUCKET: ${{ inputs.state_bucket }}
          AWS_REGION: ${{ inputs.aws_region }}
        run: terraform init -input=false -backend-config="bucket=${STATE_BUCKET}" -backend-config="region=${AWS_REGION}"

      - name: Validate Terraform
        run: terraform validate

      - name: Create Terraform plan
        run: terraform plan -input=false -out=tfplan
